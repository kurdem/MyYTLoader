<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>%%APP_NAME%%</title>
  <meta name="description" content="Selbst gehosteter Media-Downloader und privater Podcast-Server">
  <meta name="theme-color" content="#0f1115">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="%%APP_NAME%%">
  <meta name="application-name" content="%%APP_NAME%%">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest?v=%%BRANDING_V%%">
  <link rel="icon" href="branding/icon-192.png?v=%%BRANDING_V%%" type="image/png" data-brand-icon="icon-192.png">
  <link rel="apple-touch-icon" href="branding/apple-touch-icon.png?v=%%BRANDING_V%%" data-brand-icon="apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app" id="app" hidden>
    <nav class="nav" aria-label="Hauptnavigation">
      <div class="nav__brand">
        <img src="branding/icon-192.png?v=%%BRANDING_V%%" alt="" width="32" height="32" class="brand-icon" data-brand-icon="icon-192.png">
        <span data-brand-name>%%APP_NAME%%</span>
      </div>
      <a class="nav__item" href="#/" data-nav="start">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>Neu</span>
      </a>
      <a class="nav__item" href="#/jobs" data-nav="jobs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg>
        <span>Aufträge</span>
        <b class="nav__badge" id="active-badge" hidden>0</b>
      </a>
      <a class="nav__item" href="#/library" data-nav="library">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h4v14H4zM10 5h4v14h-4zM16.5 5.5l3.5 1-3.5 12.5-3.5-1z"/></svg>
        <span>Bibliothek</span>
      </a>
      <a class="nav__item" href="#/feeds" data-nav="feeds">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19h.01M5 12a7 7 0 0 1 7 7M5 5a14 14 0 0 1 14 14"/></svg>
        <span>Feeds</span>
      </a>
      <a class="nav__item" href="#/more" data-nav="more">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
        <span>Mehr</span>
      </a>
      <a class="nav__item nav__item--help" href="#/help" data-nav="help">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></svg>
        <span>Hilfe</span>
      </a>
      <div class="nav__footer" id="nav-account" hidden>
        <a class="nav__user" href="#/more" title="Konto">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
          <span id="nav-username"></span>
        </a>
        <button class="btn btn--sm btn--logout" type="button" id="nav-logout">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>
          <span>Abmelden</span>
        </button>
      </div>
    </nav>
    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <div class="login" id="login" hidden>
    <form class="login__card" id="login-form" autocomplete="on">
      <img src="branding/icon-192.png?v=%%BRANDING_V%%" alt="" width="64" height="64" class="brand-icon" data-brand-icon="icon-192.png">
      <h1 data-brand-name>%%APP_NAME%%</h1>
      <label class="field">
        <span>Benutzername</span>
        <input name="username" autocomplete="username" autocapitalize="none" required>
      </label>
      <label class="field">
        <span>Passwort</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" id="login-error" role="alert"></p>
      <button class="btn btn--primary btn--block" type="submit">Anmelden</button>
    </form>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript>Bitte JavaScript aktivieren.</noscript>
</body>
</html>
