services:
  myytloader:
    build:
      context: .
    image: myytloader:latest
    container_name: myytloader
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    volumes:
      - ${HOST_DOWNLOAD_PATH:-./data/downloads}:/downloads
      - ./data/temp:/temp
      - ./data/database:/database
      - ./data/config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Optional: Nginx Proxy Manager im selben Docker-Netzwerk.
    # Dann den Port-Eintrag oben entfernen und in NPM als Ziel "myytloader:8080" eintragen.
    # networks:
    #   - npm

# networks:
#   npm:
#     external: true
#     name: nginx-proxy-manager_default
